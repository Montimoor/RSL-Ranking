name: RSL Ranglisten

on:
  schedule:
    # Montags 06:00 UTC (im Sommer 08:00, im Winter 07:00 deutscher Zeit)
    - cron: '0 6 * * 1'
  workflow_dispatch:        # erlaubt den manuellen Start über den Actions-Tab

permissions:
  contents: write

concurrency:
  group: rsl-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Ranglisten berechnen
        run: python scripts/build_rankings.py

      - name: Ergebnis committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "RSL-Ranglisten $(date -u +%Y-%m-%d)"
            git push
          fi
