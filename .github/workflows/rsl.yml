name: RSL Ranglisten

on:
  schedule:
    # Montag bis Samstag um 05:00 UTC = 06:00 deutscher Winterzeit, 07:00 Sommerzeit.
    # Montag: volle Rechnung mit neuer Wochenrangliste.
    # Dienstag bis Samstag: nur die Tagesschlusskurse auffrischen.
    - cron: '0 5 * * 1-6'
  workflow_dispatch:
    inputs:
      modus:
        description: 'Was soll laufen?'
        type: choice
        default: auto
        options:
          - auto
          - voll
          - kurse

permissions:
  contents: write

concurrency:
  group: rsl-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Pakete installieren
        run: pip install -r requirements.txt

      - name: Modus bestimmen
        id: modus
        run: |
          WAHL="${{ github.event.inputs.modus }}"
          if [ -z "$WAHL" ] || [ "$WAHL" = "auto" ]; then
            if [ "$(date -u +%u)" = "1" ]; then WAHL="voll"; else WAHL="kurse"; fi
          fi
          echo "wahl=$WAHL" >> "$GITHUB_OUTPUT"
          echo "Modus: $WAHL"

      - name: Ranglisten berechnen
        if: steps.modus.outputs.wahl == 'voll'
        run: python scripts/build_rankings.py

      - name: Kurse auffrischen
        if: steps.modus.outputs.wahl == 'kurse'
        run: python scripts/build_rankings.py --prices-only

      - name: Ergebnis committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "RSL ${{ steps.modus.outputs.wahl }} $(date -u +%Y-%m-%d)"
            git push
          fi
